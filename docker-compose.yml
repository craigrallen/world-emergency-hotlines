# Local full-stack wiring: Caddy (static site) → CMS (Payload/Next) and payments
# (Stripe foundation) → Postgres. Mirrors the Railway topology so every route can be
# exercised at http://localhost:8080 before anything is enabled in production.
#
#   printf 'PAYLOAD_SECRET=%s\n' "$(openssl rand -hex 32)" > .env      # interpolated below
#   docker compose up --build
#   open http://localhost:8080/account   (accounts on; Stripe stays disabled unless keys are set)
#   open http://localhost:8080/admin     (first admin: put CMS_ADMIN_EMAIL/CMS_ADMIN_PASSWORD in .env.cms)
#
# Optional secrets live in two untracked env files that are only read when present,
# so unset variables are absent rather than passed as empty strings:
#   .env.cms       — CMS_ADMIN_EMAIL, CMS_ADMIN_PASSWORD, SMTP_URL, STRIPE_SECRET_KEY,
#                    STRIPE_WEBHOOK_SECRET, GATEWAY_KEY_PEPPER (see cms/.env.example)
#   .env.payments  — PAYMENTS_MODE, PAYMENTS_OFFERS, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
#                    and the durable store: PAYMENTS_STORE=cms,
#                    PAYMENTS_CMS_URL=http://cms:3000/cms/api, PAYMENTS_CMS_API_KEY=<service key>
#                    (see payments/.env.example)
# Caddy wiring: CMS_UPSTREAM and PAYMENTS_UPSTREAM point at the two services.
# Nothing here publishes a price or enables live billing; `.env*` files are gitignored.
name: world-hotlines

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  cms:
    build: ./cms
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./.env.cms
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://cms:${POSTGRES_PASSWORD:-cms-local-only}@postgres:5432/cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET (32+ random characters) in .env}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      CMS_ACCOUNTS_REGISTRATION: ${CMS_ACCOUNTS_REGISTRATION:-open}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/cms/api/account/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  payments:
    build: ./payments
    depends_on:
      cms:
        condition: service_healthy
    env_file:
      - path: ./.env.payments
        required: false
    environment:
      PAYMENTS_HOST: "::"
      PORT: "8081"
      PAYMENTS_TRUST_PROXY: "1"
      PAYMENTS_PUBLIC_ORIGIN: ${PUBLIC_SITE_URL:-http://localhost:8080}

  web:
    build: .
    depends_on:
      - cms
      - payments
    environment:
      PORT: "8080"
      CMS_UPSTREAM: cms:3000
      PAYMENTS_UPSTREAM: payments:8081
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
