name = "world-emergency-hotlines"
compatibility_date = "2026-04-01"
pages_build_output_dir = "./dist"

# D1 database binding — created separately with:
#   wrangler d1 create world-hotlines
# Replace database_id with the ID returned by that command.
[[d1_databases]]
binding = "HOTLINES_DB"
database_name = "world-hotlines"
database_id = "REPLACE_ME_AFTER_wrangler_d1_create"

# Workers AI binding for server-side ML fallbacks.
# Uncomment once you enable Workers AI on the account.
# [ai]
# binding = "AI"
