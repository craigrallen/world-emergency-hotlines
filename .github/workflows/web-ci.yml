name: Web CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify all static contracts
        run: npm run verify:all

      - name: Typecheck
        run: npm run typecheck

      - name: Validate and integration-test Caddy release routes
        run: npm run verify:caddy

      - name: Build and smoke-test the deployment image
        working-directory: .
        run: sh web/scripts/verify-docker-image.sh
