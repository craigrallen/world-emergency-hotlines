name: Web CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: 1786579200

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Verify dataset registry inputs and append-only PR history
        env:
          DATASET_RELEASE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: npm run verify:feeds

      - name: Generate deterministic data and build
        run: npm run build

      - name: Reject generated contract changes
        working-directory: .
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- web/public/gateway/v1 web/public/organizations/v1 web/public/managed-widget-config/v1 web/public/technical-health/v1 web/public/assurance-packs/v1 web/public/provider-claims/v1)"

      - name: Verify all static contracts
        run: npm run verify:all

      - name: Typecheck
        run: npm run typecheck

      - name: Validate and integration-test Caddy release routes
        run: npm run verify:caddy

      - name: Build and smoke-test the deployment image
        working-directory: .
        run: sh web/scripts/verify-docker-image.sh
