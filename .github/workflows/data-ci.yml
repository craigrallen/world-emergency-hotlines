name: Data CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Parse hotlines.json
        run: python -c "import json; json.load(open('hotlines.json', encoding='utf-8'))"

      - name: Validate canonical dataset
        run: python scripts/validate_canonical.py

      - name: Guard immutable record IDs against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:hotlines.json" > "$RUNNER_TEMP/hotlines-base.json"
          python scripts/check_record_id_stability.py --baseline "$RUNNER_TEMP/hotlines-base.json" --current hotlines.json

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
