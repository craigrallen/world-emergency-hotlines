name: Data CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 454800bd4f854592bcfe79b161f71d56e35940eb7016e48a26dd356adc9d400a
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          source_dir="$RUNNER_TEMP/actionlint-source"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/archive/refs/tags/v${ACTIONLINT_VERSION}.tar.gz" --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          mkdir "$source_dir"
          tar --extract --gzip --file "$archive" --directory "$source_dir" --strip-components=1
          go -C "$source_dir" build -trimpath -o "$RUNNER_TEMP/actionlint" ./cmd/actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Parse hotlines.json
        run: python -c "import json; json.load(open('hotlines.json', encoding='utf-8'))"

      - name: Validate canonical dataset
        run: python scripts/validate_canonical.py

      - name: Guard immutable record IDs against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:hotlines.json" > "$RUNNER_TEMP/hotlines-base.json"
          python scripts/check_record_id_stability.py --baseline "$RUNNER_TEMP/hotlines-base.json" --current hotlines.json

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
