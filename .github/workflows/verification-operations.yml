name: Verification Operations

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Deterministic review date (YYYY-MM-DD); defaults to UTC run date"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Choose deterministic date
        id: date
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import re

          today = dt.datetime.now(dt.timezone.utc).date()
          value = os.environ.get("REQUESTED_AS_OF", "") or today.isoformat()
          if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", value, flags=re.ASCII) is None:
              raise SystemExit("as_of must be an exact ASCII YYYY-MM-DD date")
          try:
              parsed = dt.date.fromisoformat(value)
          except ValueError as exc:
              raise SystemExit("as_of must be a real Gregorian date") from exc
          if value != parsed.isoformat():
              raise SystemExit("as_of must use canonical YYYY-MM-DD form")
          if parsed > today:
              raise SystemExit("as_of must not be after the current UTC date")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="ascii", newline="\n") as output:
              output.write(f"as_of={value}\n")
          PY
      - name: Retrieve latest successful prior snapshot when available
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPORT_AS_OF: ${{ steps.date.outputs.as_of }}
        run: |
          set +e
          mkdir -p prior
          python scripts/manual_prior_history.py retrieve \
            --repository "$GITHUB_REPOSITORY" --workflow verification-operations.yml \
            --branch "$DEFAULT_BRANCH" --current-run "$CURRENT_RUN_ID" \
            --as-of "$REPORT_AS_OF" --output prior/source-snapshot.json
          retrieval_status=$?
          if [ "$retrieval_status" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "reason=authenticated compatible prior snapshot" >> "$GITHUB_OUTPUT"
            echo "Prior snapshot: authenticated compatible history enabled." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$retrieval_status" -eq 4 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=no compatible prior snapshot after bounded fallback" >> "$GITHUB_OUTPUT"
            echo "Prior snapshot: unavailable after exhausting bounded history." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Prior snapshot retrieval failed locally." >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi
      - name: Generate read-only reviewer artifacts
        env:
          REPORT_AS_OF: ${{ steps.date.outputs.as_of }}
          PRIOR_AVAILABLE: ${{ steps.prior.outputs.available }}
        run: |
          mkdir operations-output
          before=$(sha256sum hotlines.json | cut -d' ' -f1)
          python scripts/freshness_report.py --as-of "$REPORT_AS_OF" --review-limit 250 --json-report operations-output/freshness.json --report operations-output/freshness.md
          previous=()
          if [ "$PRIOR_AVAILABLE" = "true" ]; then
            previous=(--previous prior/source-snapshot.json)
          fi
          python scripts/source_monitor.py --as-of "$REPORT_AS_OF" --limit 25 "${previous[@]}" --json-output operations-output/source-snapshot.json --markdown-output operations-output/source-report.md
          python scripts/verification_workbench.py --as-of "$REPORT_AS_OF" --freshness operations-output/freshness.json --source-monitor operations-output/source-snapshot.json --json-output operations-output/workbench.json --markdown-output operations-output/workbench.md
          python scripts/prior_artifact.py --source-snapshot operations-output/source-snapshot.json --source-manifest-output operations-output/source-snapshot-manifest.json --as-of "$REPORT_AS_OF"
          after=$(sha256sum hotlines.json | cut -d' ' -f1)
          test "$before" = "$after"
      - name: Publish summary
        run: |
          {
            cat operations-output/source-report.md
            printf '\n'
            cat operations-output/workbench.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: verification-operations-${{ steps.date.outputs.as_of }}
          path: operations-output/
          if-no-files-found: error
          retention-days: 30
